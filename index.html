<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家庭仓库 / 收纳箱管理 V4</title>
<style>
:root{
  --bg:#f4f7f5;--card:#fff;--ink:#18231f;--muted:#66746e;--line:#dbe4df;
  --accent:#176b4c;--accent2:#e7f3ed;--danger:#b62f3b;--danger2:#fbecee;
  --warn:#9b6200;--warn2:#fff4df;--shadow:0 4px 18px rgba(19,45,34,.06)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:9px;background:var(--accent);color:#fff;padding:9px 13px;cursor:pointer}
button:hover{filter:brightness(.96)}
button.secondary{background:var(--accent2);color:#164f39}
button.danger{background:var(--danger)}
button.ghost{background:transparent;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid #c7d4ce;border-radius:9px;padding:9px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
label{display:block;font-size:13px;font-weight:650;margin:11px 0 5px}
.header{background:#123d30;color:#fff;padding:16px max(16px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:20px;font-weight:800}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.header button{background:#fff;color:#174b38}
.layout{max-width:1180px;margin:auto;padding:18px;display:grid;grid-template-columns:215px 1fr;gap:18px}
.sidebar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow);height:max-content}
.nav{width:100%;display:block;text-align:left;background:transparent;color:var(--ink);border-radius:9px;margin:2px 0}
.nav:hover,.nav.active{background:var(--accent2);color:#0d573c}
.content{min-width:0}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.metric{font-size:28px;font-weight:800}.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}
.section-title{font-size:19px;margin:0 0 12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{max-width:360px}
.list{display:grid;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px}
.badge{display:inline-block;background:#eef5f1;color:#31584a;border-radius:999px;padding:3px 8px;font-size:12px;margin:2px 4px 2px 0}
.badge.warn{background:var(--warn2);color:var(--warn)}
.badge.danger{background:var(--danger2);color:var(--danger)}
.actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:9px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted)}
.tree{margin:0;padding-left:18px}.tree li{margin:5px 0}
.location-node{padding:7px;border-radius:8px;cursor:pointer}.location-node:hover{background:#f0f6f3}
.path{color:var(--muted);font-size:12px}
.search-result{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.result-type{font-size:11px;color:var(--muted);text-transform:uppercase}
.kpi-note{margin-top:5px}
.dialog-back{position:fixed;inset:0;background:rgba(8,27,21,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.dialog-back.open{display:flex}
.dialog{width:min(620px,100%);background:#fff;border-radius:15px;box-shadow:0 20px 70px rgba(0,0,0,.22);max-height:90vh;overflow:auto}
.dialog-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.dialog-head h2{font-size:18px;margin:0}
.dialog-body{padding:15px 17px}
.notice{background:var(--accent2);color:#14583e;padding:10px 12px;border-radius:9px;margin:10px 0}
.warning{background:var(--warn2);color:#855300;padding:10px 12px;border-radius:9px;margin:10px 0}
.footer-note{color:var(--muted);font-size:12px;margin-top:14px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.photo-grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.hidden{display:none!important}
@media(max-width:780px){
  .layout{grid-template-columns:1fr;padding:12px}
  .sidebar{display:flex;overflow:auto}
  .nav{white-space:nowrap;width:auto}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .header{padding:12px}
  .header-actions{justify-content:flex-end}
}
</style>
</head>
<body>

<header class="header">
  <div class="brand">📦 家庭仓库 / 收纳箱</div>
  <div class="header-actions">
    <button type="button" id="backupBtn">备份 JSON</button>
    <button type="button" id="restoreBtn">恢复备份</button>
    <input id="restoreInput" type="file" accept="application/json" class="hidden">
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <button class="nav active" data-view="dashboard">总览</button>
    <button class="nav" data-view="containers">📦 收纳箱</button>
    <button class="nav" data-view="items">🏷️ 物品</button>
    <button class="nav" data-view="locations">📍 位置</button>
    <button class="nav" data-view="history">🧾 操作流水</button>
    <button class="nav" data-view="settings">⚙️ 设置</button>
  </aside>

  <main class="content">

    <section id="dashboard" class="view active">
      <div class="row spread">
        <div>
          <h2 class="section-title">家庭仓库总览</h2>
          <div class="muted">核心目标：快速回答“这个东西在哪里？”</div>
        </div>
        <div class="row">
          <button type="button" data-open="container">＋ 新增收纳箱</button>
          <button type="button" class="secondary" data-open="item">＋ 新增物品</button>
          <button type="button" class="secondary" data-open="location">＋ 新增位置</button>
        </div>
      </div>
      <div id="metrics" class="grid" style="margin-top:14px"></div>
      <div class="card" style="margin-top:14px">
        <h3 style="margin-top:0">最近操作</h3>
        <div id="recentHistory" class="list"></div>
      </div>
      <div class="card" style="margin-top:14px">
        <h3 style="margin-top:0">搜索库存</h3>
        <div class="toolbar">
          <input id="dashSearch" placeholder="搜索物品、规格、收纳箱、位置或标签">
        </div>
        <div id="dashSearchResults"><div class="empty">输入关键词即可搜索</div></div>
      </div>
    </section>


    <section id="containers" class="view">
      <div class="card">
        <div class="row spread">
          <h2 class="section-title">收纳箱</h2>
          <button type="button" data-open="container">＋ 新增收纳箱</button>
        </div>
        <div class="toolbar">
          <input id="containerFilter" placeholder="搜索箱子名称 / 标签 / 位置">
        </div>
        <div id="containerList" class="list"></div>
      </div>
    </section>

    <section id="items" class="view">
      <div class="card">
        <div class="row spread">
          <h2 class="section-title">物品</h2>
          <button type="button" data-open="item">＋ 新增物品</button>
        </div>
        <div class="toolbar">
          <input id="itemFilter" placeholder="搜索物品 / 规格 / 标签">
        </div>
        <div id="itemList"></div>
      </div>
    </section>

    <section id="locations" class="view">
      <div class="card">
        <div class="row spread">
          <h2 class="section-title">位置</h2>
          <button type="button" data-open="location">＋ 新增位置</button>
        </div>
        <div id="locationTree"></div>
      </div>
    </section>

    <section id="history" class="view">
      <div class="card">
        <div class="row spread">
          <h2 class="section-title">操作流水</h2>
          <span class="muted">库存变更与整箱移动都会记录</span>
        </div>
        <div id="historyList" class="table-wrap"></div>
      </div>
    </section>

    <section id="settings" class="view">
      <div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
        <div class="card">
          <h3>数据</h3>
          <p class="muted">V1 使用浏览器 localStorage 保存。结构已经按后续 IndexedDB + Supabase 可迁移的实体关系设计。</p>
          <div class="actions">
            <button type="button" id="backupBtn2">导出 JSON</button>
            <button type="button" class="secondary" id="restoreBtn2">导入 JSON</button>
            <button type="button" class="danger" id="resetBtn">恢复示例数据</button>
          </div>
        </div>
        <div class="card">
          <h3>V1 数据模型</h3>
          <div class="muted">
            位置 → 收纳箱 → 箱内存放记录 → 物品<br><br>
            整箱移动只改变 Container 当前 Location，不需要逐个修改里面的物品。<br><br>
            物品可以位于多个箱子；箱子可以包含多个物品。
          </div>
        </div>
      </div>
    </section>

  </main>
</div>

<div id="modalBack" class="dialog-back">
  <div class="dialog" role="dialog" aria-modal="true">
    <div class="dialog-head">
      <h2 id="modalTitle">操作</h2>
      <button type="button" class="ghost" id="modalClose">×</button>
    </div>
    <div class="dialog-body" id="modalBody"></div>
  </div>
</div>

<div id="confirmBack" class="dialog-back">
  <div class="dialog" role="dialog" aria-modal="true">
    <div class="dialog-head">
      <h2 id="confirmTitle">确认操作</h2>
      <button type="button" class="ghost" id="confirmClose">×</button>
    </div>
    <div class="dialog-body">
      <div id="confirmText"></div>
      <div class="actions">
        <button type="button" class="secondary" id="confirmCancel">取消</button>
        <button type="button" class="danger" id="confirmYes">确认</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

const KEY = "home-warehouse-v1";
let db = null;
let modalAction = null;

const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => [...root.querySelectorAll(s)];
const uid = (p="id") => p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9);
const iso = () => new Date().toISOString();
const fmtTime = x => x ? new Date(x).toLocaleString("zh-CN",{hour12:false}) : "—";
const esc = s => String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const arr = v => Array.isArray(v) ? v : [];
const tagsOf = s => arr(s).filter(Boolean);

function seed(){
  const house=uid("loc"),garage=uid("loc"),shed=uid("loc"),attic=uid("loc"),office=uid("loc");
  const c1=uid("ct"),c2=uid("ct"),c3=uid("ct");
  const i1=uid("it"),i2=uid("it"),i3=uid("it"),i4=uid("it"),i5=uid("it"),i6=uid("it");
  return {
    version:1,
    locations:[
      {id:house,name:"房屋",parentId:null,type:"区域",tags:["家"],notes:""},
      {id:garage,name:"车库",parentId:house,type:"房屋",tags:["收纳"],notes:""},
      {id:shed,name:"后院储物棚",parentId:house,type:"房屋",tags:["户外"],notes:""},
      {id:attic,name:"阁楼",parentId:house,type:"区域",tags:["长期"],notes:""},
      {id:office,name:"书房",parentId:house,type:"房间",tags:["室内"],notes:""}
    ],
    containers:[
      {id:c1,name:"红色收纳箱 01",code:"BOX-001",type:"塑料箱",locationId:garage,tags:["工具","常用"],notes:"带盖；中号",status:"ACTIVE",photos:[]},
      {id:c2,name:"透明收纳箱 02",code:"BOX-002",type:"塑料箱",locationId:attic,tags:["圣诞"],notes:"季节性用品",status:"ACTIVE",photos:[]},
      {id:c3,name:"工具箱",code:"BOX-003",type:"工具箱",locationId:shed,tags:["工具"],notes:"",status:"ACTIVE",photos:[]}
    ],
    items:[
      {id:i1,name:"圣诞树",variant:"1.8m",unit:"件",minStock:0,tags:["圣诞","季节"],notes:""},
      {id:i2,name:"圣诞彩灯",variant:"暖白 10m",unit:"卷",minStock:0,tags:["圣诞"],notes:""},
      {id:i3,name:"螺丝刀套装",variant:"Phillips + Flat",unit:"套",minStock:0,tags:["工具"],notes:""},
      {id:i4,name:"延长线",variant:"10m",unit:"条",minStock:1,tags:["电器","工具"],notes:""},
      {id:i5,name:"油漆刷",variant:"2 inch",unit:"把",minStock:2,tags:["装修"],notes:""},
      {id:i6,name:"露营灯",variant:"LED",unit:"个",minStock:1,tags:["户外","露营"],notes:""}
    ],
    containerItems:[
      {id:uid("ci"),containerId:c2,itemId:i1,quantity:1,unit:"件",notes:"树体"},
      {id:uid("ci"),containerId:c2,itemId:i2,quantity:3,unit:"卷",notes:""},
      {id:uid("ci"),containerId:c3,itemId:i3,quantity:1,unit:"套",notes:""},
      {id:uid("ci"),containerId:c3,itemId:i5,quantity:2,unit:"把",notes:""},
      {id:uid("ci"),containerId:c1,itemId:i4,quantity:2,unit:"条",notes:""},
      {id:uid("ci"),containerId:c3,itemId:i6,quantity:1,unit:"个",notes:""}
    ],
    transactions:[
      {id:uid("tx"),time:iso(),type:"INIT",label:"创建示例数据",quantity:null,unit:null,containerId:null,itemId:null,sourceLocationId:null,targetLocationId:null,notes:"V1 示例"}
    ],
    settings:{}
  };
}

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"null");
    if(!x || x.version!==1 || !Array.isArray(x.locations) || !Array.isArray(x.containers) || !Array.isArray(x.items) || !Array.isArray(x.containerItems)) return seed();
    return x;
  }catch(e){ return seed(); }
}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
db=load();

function location(id){return db.locations.find(x=>x.id===id)}
function container(id){return db.containers.find(x=>x.id===id)}
function item(id){return db.items.find(x=>x.id===id)}
function containerItems(cid){return db.containerItems.filter(x=>x.containerId===cid)}
function itemContainers(iid){return db.containerItems.filter(x=>x.itemId===iid)}
function rootLocations(){return db.locations.filter(x=>!x.parentId)}
function locationChildren(id){return db.locations.filter(x=>x.parentId===id)}
function locationPath(id){
  const out=[];let cur=location(id),guard=0;
  while(cur && guard++<30){out.unshift(cur.name);cur=cur.parentId?location(cur.parentId):null}
  return out.join(" / ");
}
function locationHasChildren(id){return db.locations.some(x=>x.parentId===id)}
function locationUsed(id){return db.containers.some(c=>c.locationId===id)}
function containerQty(cid){
  return db.containerItems.filter(x=>x.containerId===cid).reduce((n,x)=>n+(Number(x.quantity)||0),0)
}
function itemTotal(iid){
  return db.containerItems.filter(x=>x.itemId===iid).reduce((n,x)=>n+(Number(x.quantity)||0),0)
}
function log(type,label,data={}){
  db.transactions.unshift({
    id:uid("tx"),time:iso(),type,label,
    quantity:data.quantity??null,unit:data.unit??null,
    containerId:data.containerId||null,itemId:data.itemId||null,
    sourceLocationId:data.sourceLocationId||null,targetLocationId:data.targetLocationId||null,
    notes:data.notes||""
  });
  if(db.transactions.length>500)db.transactions.length=500;
}

function showView(id){
  $$(".view").forEach(v=>v.classList.toggle("active",v.id===id));
  $$(".nav").forEach(b=>b.classList.toggle("active",b.dataset.view===id));
  renderCurrent();
}
function renderCurrent(){
  if($("#dashboard").classList.contains("active"))renderDashboard();
  if($("#containers").classList.contains("active"))renderContainers();
  if($("#items").classList.contains("active"))renderItems();
  if($("#locations").classList.contains("active"))renderLocations();
  if($("#history").classList.contains("active"))renderHistory();
}

function renderAll(){
  save();
  renderDashboard();renderContainers();renderItems();renderLocations();renderHistory();
}

function renderDashboard(){
  const activeContainers=db.containers.filter(c=>c.status!=="ARCHIVED");
  const occupiedRows=db.containerItems.filter(x=>Number(x.quantity)>0);
  const emptyContainers=activeContainers.filter(c=>
    !db.containerItems.some(x=>x.containerId===c.id && Number(x.quantity)>0)
  );
  const low=db.items.filter(i=>Number(i.minStock)>0&&itemTotal(i.id)<Number(i.minStock));

  $("#metrics").innerHTML=[
    ["收纳箱",activeContainers.length,`${emptyContainers.length} 个空箱`],
    ["物品种类",db.items.length,`${occupiedRows.length} 条存放记录`],
    ["位置",db.locations.length,`${rootLocations().length} 个顶级位置`],
    ["低库存",low.length,low.length?"需要补充":"暂无提醒"]
  ].map(x=>`<div class="card"><div class="metric">${esc(x[1])}</div><div class="muted">${esc(x[0])}</div><div class="kpi-note muted">${esc(x[2])}</div></div>`).join("");

  const tx=db.transactions.slice(0,8);
  $("#recentHistory").innerHTML=tx.length?tx.map(t=>{
    const c=t.containerId?container(t.containerId):null,i=t.itemId?item(t.itemId):null;
    return `<div class="item"><div class="row spread"><div><b>${esc(t.label)}</b><div class="muted">${fmtTime(t.time)}</div></div><div>${c?`<span class="badge">${esc(c.name)}</span>`:""}${i?`<span class="badge">${esc(i.name)}</span>`:""}</div></div>${t.notes?`<div class="muted">${esc(t.notes)}</div>`:""}</div>`
  }).join(""):"<div class='empty'>暂无操作</div>";

  const q=$("#dashSearch")?.value.trim()||"";
  if(q)renderSearchResults(q,"#dashSearchResults");
  else if($("#dashSearchResults"))$("#dashSearchResults").innerHTML='<div class="empty">输入关键词即可搜索</div>';
}

function matchText(...xs){
  return xs.filter(Boolean).join(" ").toLowerCase()
}
function renderSearchResults(q,target){
  const qq=q.toLowerCase();
  const results=[];
  db.items.forEach(i=>{
    if(matchText(i.name,i.variant,i.unit,tagsOf(i.tags).join(" "),i.notes).includes(qq))
      results.push({kind:"物品",name:i.name,sub:i.variant||"无规格",detail:`总数量 ${itemTotal(i.id)} ${i.unit||""}`,id:i.id,action:"item"});
  });
  db.containers.forEach(c=>{
    const l=location(c.locationId);
    if(matchText(c.name,c.code,c.type,tagsOf(c.tags).join(" "),c.notes,l?.name,locationPath(c.locationId)).includes(qq))
      results.push({kind:"收纳箱",name:c.name,sub:c.type||"收纳箱",detail:`位置：${locationPath(c.locationId)} · ${containerQty(c.id)} 件物品`,id:c.id,action:"container"});
  });
  db.locations.forEach(l=>{
    if(matchText(l.name,l.type,tagsOf(l.tags).join(" "),l.notes,locationPath(l.id)).includes(qq))
      results.push({kind:"位置",name:l.name,sub:l.type||"区域",detail:locationPath(l.id),id:l.id,action:"location"});
  });
  const box=$(target);
  if(!results.length){box.innerHTML='<div class="card empty">没有匹配结果</div>';return;}
  box.innerHTML=`<div class="list">${results.slice(0,50).map(r=>`
    <div class="item search-result">
      <div><div class="result-type">${esc(r.kind)}</div><b>${esc(r.name)}</b><div class="muted">${esc(r.sub)}</div><div class="path">${esc(r.detail)}</div></div>
      <div><button type="button" class="secondary" data-result-action="${r.action}" data-id="${r.id}">查看</button></div>
    </div>`).join("")}</div>`;
}

function renderContainers(){
  const q=$("#containerFilter").value.trim().toLowerCase();
  const rows=db.containers.filter(c=>{
    const l=location(c.locationId);
    return !q||matchText(c.name,c.code,c.type,tagsOf(c.tags).join(" "),c.notes,l?.name,locationPath(c.locationId)).includes(q)
  });
  $("#containerList").innerHTML=rows.length?rows.map(c=>{
    const l=location(c.locationId);
    const entries=containerItems(c.id).filter(x=>Number(x.quantity)>0);
    return `<div class="item">
      <div class="row spread">
        <div><b>📦 ${esc(c.name)}</b> ${c.status==="ARCHIVED"?'<span class="badge">归档</span>':(containerItems(c.id).some(x=>Number(x.quantity)>0)?"":'<span class="badge warn">空箱</span>')}
          <div class="path">📍 ${esc(locationPath(c.locationId)||"未指定位置")}</div>
        </div>
        <div class="row">
          <button type="button" class="secondary" data-action="viewContainer" data-id="${c.id}">详情</button>
          <button type="button" class="secondary" data-action="editContainer" data-id="${c.id}">编辑</button>
          <button type="button" class="secondary" data-action="moveContainer" data-id="${c.id}">移动箱子</button>
          <button type="button" class="danger" data-action="deleteContainer" data-id="${c.id}">删除</button>
        </div>
      </div>
      <div style="margin-top:8px">${tagsOf(c.tags).map(t=>`<span class="badge">${esc(t)}</span>`).join("")}</div>

function renderLocations(){
  const renderNode=id=>{
    const l=location(id),children=locationChildren(id);
    return `<li><div class="location-node"><div class="row spread"><div data-action="viewLocation" data-id="${id}" style="flex:1;cursor:pointer"><b>📍 ${esc(l.name)}</b> <span class="badge">${esc(l.type||"区域")}</span><div class="path">${esc(locationPath(id))}</div></div><button type="button" class="danger" data-action="deleteLocation" data-id="${id}">删除</button></div></div>${children.length?`<ul class="tree">${children.map(c=>renderNode(c.id)).join("")}</ul>`:""}</li>`

}

function renderHistory(){

}
function closeModal(){ $("#modalBack").classList.remove("open");modalAction=null; }

}
function optionsLocations(selected=""){

function optionsContainers(selected=""){

    ${modalFormButtons(i?"保存修改":"创建物品")}

    const data={name,variant:$("#f_variant").value.trim(),unit:$("#f_unit").value.trim()||"件",minStock:Number($("#f_min").value)||0,
      tags:$("#f_tags").value.split(/[，,]/).map(x=>x.trim()).filter(Boolean),notes:$("#f_notes").value.trim()};

    if(i){

      return;

    const x={id:uid("it"),...data};

      db.containerItems.push({

      });

      });

      log("MASTER","新增物品",{itemId:x.id,notes:x.name});
    }

    closeModal();renderAll();toast(cid&&qty>0?"物品已创建并放入收纳箱":"物品已创建");

function openLocation(id=null,parentPreset=null){
  const l=id?location(id):null;
  openModal(l?"编辑位置":"新增位置",`
    <label>位置名称<input id="f_name" value="${esc(l?.name||"")}" placeholder="例如：车库北墙" required></label>
    <label>父级位置<select id="f_parent"><option value="">无（顶级）</option>${db.locations.filter(x=>x.id!==id).map(x=>`<option value="${x.id}" ${((l?.parentId||parentPreset||"")===x.id)?"selected":""}>${esc(locationPath(x.id))}</option>`).join("")}</select></label>
    <label>类型<input id="f_type" value="${esc(l?.type||"区域")}" placeholder="房间 / 柜子 / 货架 / 区域"></label>
    <label>标签（逗号分隔）<input id="f_tags" value="${esc(tagsOf(l?.tags).join(","))}"></label>
    <label>备注<textarea id="f_notes" rows="3">${esc(l?.notes||"")}</textarea></label>
    ${modalFormButtons(l?"保存修改":"创建位置")}
  `,()=>{
    const name=$("#f_name").value.trim();if(!name)throw Error("请输入位置名称");
    const parent=$("#f_parent").value||null;
    if(l && parent===l.id)throw Error("位置不能把自己作为父级");
    // Cycle prevention
    if(l&&parent){
      let cur=parent,guard=0;while(cur&&guard++<30){if(cur===l.id)throw Error("不能把子位置设为自己的父级");cur=location(cur)?.parentId||null}
    }
    const data={name,parentId:parent,type:$("#f_type").value.trim()||"区域",tags:$("#f_tags").value.split(/[，,]/).map(x=>x.trim()).filter(Boolean),notes:$("#f_notes").value.trim()};
    if(l)Object.assign(l,data),log("MASTER","修改位置",{notes:l.name});
    else{const x={id:uid("loc"),...data};db.locations.push(x);log("MASTER","新增位置",{notes:x.name})}
    closeModal();renderAll();toast(l?"位置已修改":"位置已创建");
  });
}

  const rows=itemContainers(id).filter(x=>Number(x.quantity)>0);
  if(rows.length){
    const detail=rows.map(x=>`${container(x.containerId)?.name||"未知箱"}：${x.quantity} ${i.unit||""}`).join("<br>");
    openConfirm("删除物品",
      `物品 <b>“${esc(i.name)}”</b> 仍有库存：<br><br>${detail}<br><br><b>删除后将同时删除这些库存记录。</b>`,
      ()=>{
        db.items=db.items.filter(x=>x.id!==id);
        db.containerItems=db.containerItems.filter(x=>x.itemId!==id);
        log("MASTER","删除物品",{itemId:id,notes:i.name});
        renderAll();toast("物品及其库存记录已删除");
      });
    return;
  }
  openConfirm("删除物品",`确定删除物品 <b>“${esc(i.name)}”</b> 吗？<br><br>当前没有库存。`,()=>{

function deleteLocation(id){

  });

function openItemOperation(id){
  const i=item(id);if(!i)return;
  openModal(`物品库存操作 · ${i.name}`,`
    <label>操作<select id="f_op"><option value="add">新增数量</option><option value="remove">取出数量</option><option value="transfer">箱间转移</option></select></label>
    <label>收纳箱<select id="f_container">${optionsContainers()}</select></label>
    <label id="f_to_wrap" class="hidden">目标收纳箱<select id="f_to">${optionsContainers()}</select></label>
    <label>数量<input id="f_qty" type="number" min="0.01" step="0.01" value="1"></label>
    <label>备注<input id="f_note" placeholder="例如：新买入 / 用掉 / 整理"></label>
    <div id="operationHelp" class="notice">新增数量：把物品放入指定收纳箱。</div>
    ${modalFormButtons("执行操作")}
  `,()=>{
    const op=$("#f_op").value,cid=$("#f_container").value,to=$("#f_to").value,qty=Number($("#f_qty").value);
    if(!cid||!Number.isFinite(qty)||qty<=0)throw Error("请选择收纳箱并填写有效数量");
    let row=db.containerItems.find(x=>x.containerId===cid&&x.itemId===id);
    if(op==="add"){
      if(!row){row={id:uid("ci"),containerId:cid,itemId:id,quantity:0,unit:i.unit,notes:""};db.containerItems.push(row)}
      const before=row.quantity;row.quantity+=qty;
      const c=container(cid);c.status="ACTIVE";
      log("ADD_ITEM","新增物品",{containerId:cid,itemId:id,quantity:qty,unit:i.unit,notes:$("#f_note").value.trim()||`前 ${before}，后 ${row.quantity}`});
    }else if(op==="remove"){
      if(!row||row.quantity<qty)throw Error(`该收纳箱中的库存不足。当前为 ${row?.quantity||0} ${i.unit||""}`);
      row.quantity-=qty;
      log("REMOVE_ITEM","取出物品",{containerId:cid,itemId:id,quantity:qty,unit:i.unit,notes:$("#f_note").value.trim()});
      if(row.quantity===0)db.containerItems=db.containerItems.filter(x=>x.id!==row.id);
      if(!containerItems(cid).some(x=>Number(x.quantity)>0))container(cid).status="EMPTY";
    }else{
      if(!row||row.quantity<qty)throw Error("来源收纳箱库存不足");
      if(!to||to===cid)throw Error("请选择不同的目标收纳箱");
      let dst=db.containerItems.find(x=>x.containerId===to&&x.itemId===id);
      if(!dst){dst={id:uid("ci"),containerId:to,itemId:id,quantity:0,unit:i.unit,notes:""};db.containerItems.push(dst)}
      row.quantity-=qty;dst.quantity+=qty;
      log("TRANSFER_ITEM","转移物品",{containerId:cid,itemId:id,quantity:qty,unit:i.unit,notes:`→ ${container(to).name}${$("#f_note").value.trim()?`；${$("#f_note").value.trim()}`:""}`});
      if(row.quantity===0)db.containerItems=db.containerItems.filter(x=>x.id!==row.id);
      container(to).status="ACTIVE";
      if(!containerItems(cid).some(x=>Number(x.quantity)>0))container(cid).status="EMPTY";
    }
    closeModal();renderAll();toast("操作完成");
  });
  const sync=()=>{
    const op=$("#f_op").value;
    $("#f_to_wrap").classList.toggle("hidden",op!=="transfer");
    $("#operationHelp").textContent=op==="add"?"新增数量：把物品放入指定收纳箱。":op==="remove"?"取出数量：从指定收纳箱扣减。":"箱间转移：把数量从一个箱子移动到另一个箱子。";
  };
  $("#f_op").onchange=sync;sync();
}

function toast(text){
  let e=$("#toast");if(!e){e=document.createElement("div");e.id="toast";e.style.cssText="position:fixed;right:16px;bottom:16px;background:#163c30;color:#fff;padding:11px 14px;border-radius:10px;z-index:50;box-shadow:0 8px 24px #0003";document.body.appendChild(e)}
  e.textContent=text;e.style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display="none",2200);
}

function viewLocation(id){
  const l=location(id);if(!l)return;
  const cs=db.containers.filter(c=>c.locationId===id);
  const children=locationChildren(id);
  openModal(`位置 · ${l.name}`,`
    <div class="notice">📍 ${esc(locationPath(id))}</div>
    ${l.notes?`<p class="muted">${esc(l.notes)}</p>`:""}
    <h3>这里的收纳箱</h3>
    ${cs.length?cs.map(c=>`<div class="item"><b>📦 ${esc(c.name)}</b><div class="muted">${esc(c.code)} · ${containerQty(c.id)} 件物品</div></div>`).join(""):'<div class="empty">这里没有收纳箱</div>'}
    <h3>子位置</h3>
    ${children.length?children.map(x=>`<div class="item"><b>${esc(x.name)}</b><div class="path">${esc(locationPath(x.id))}</div></div>`).join(""):'<div class="empty">没有子位置</div>'}
    <div class="actions"><button type="button" class="danger" id="locDelete">删除位置</button>${modalFormButtons("关闭")}</div>
  `,()=>closeModal());
  $("#modalSubmit").textContent="关闭";$("#modalCancel").onclick=closeModal;
  $("#locDelete").onclick=()=>{
    if(locationHasChildren(id)){alert("该位置还有子位置，不能删除。请先删除/移动子位置。");return}
    if(locationUsed(id)){alert("该位置仍有收纳箱，不能删除。请先移动收纳箱。");return}
    openConfirm("删除位置",`确定删除位置 <b>“${esc(l.name)}”</b> 吗？`,()=>{
      db.locations=db.locations.filter(x=>x.id!==id);log("MASTER","删除位置",{notes:l.name});closeModal();renderAll();toast("位置已删除");
    });
  };
}


let pendingConfirm=null;
function openConfirm(title,text,onYes){
  $("#confirmTitle").textContent=title;
  $("#confirmText").innerHTML=text;
  pendingConfirm=onYes;
  $("#confirmBack").classList.add("open");
}
function closeConfirm(){
  $("#confirmBack").classList.remove("open");
  pendingConfirm=null;
}
$("#confirmClose")?.addEventListener("click",closeConfirm);
$("#confirmCancel")?.addEventListener("click",closeConfirm);
$("#confirmBack")?.addEventListener("click",e=>{if(e.target===$("#confirmBack"))closeConfirm()});
$("#confirmYes")?.addEventListener("click",()=>{
  const fn=pendingConfirm;
  closeConfirm();
  if(fn)fn();
});
function handleModalSubmit(){
  try{if(modalAction)modalAction()}catch(e){alert(e.message||String(e))}
}

$$(".nav").forEach(b=>b.addEventListener("click",()=>showView(b.dataset.view)));

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-action],[data-open]");
  if(!b)return;

  if(b.dataset.open){
    const k=b.dataset.open;
    if(k==="container")openContainer();
    else if(k==="item")openItem();
    else if(k==="location")openLocation();
    return;
  }

  const a=b.dataset.action,id=b.dataset.id;
  if(a==="viewContainer")return openContainerDetail(id);
  if(a==="editContainer")return openContainer(id);
  if(a==="moveContainer")return openMoveContainer(id);
  if(a==="deleteContainer")return deleteContainer(id);
  if(a==="viewItem")return openItemDetail(id);
  if(a==="editItem")return openItem(id);
  if(a==="itemOperation")return openItemOperation(id);
  if(a==="deleteItem")return deleteItem(id);
  if(a==="viewLocation")return viewLocation(id);
  if(a==="deleteLocation")return deleteLocation(id);

  const ra=b.dataset.resultAction,rid=b.dataset.id;
  if(ra==="item"){showView("items");$("#itemFilter").value=item(rid)?.name||"";return}
  if(ra==="container"){showView("containers");$("#containerFilter").value=container(rid)?.name||"";return}
  if(ra==="location"){showView("locations");return}
});

$("#modalClose").onclick=closeModal;
$("#modalBack").addEventListener("click",e=>{if(e.target===$("#modalBack"))closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modalBack").classList.contains("open"))closeModal()});
$("#modalBody").addEventListener("click",e=>{
  if(e.target.id==="modalCancel"){closeModal();return}
  if(e.target.id==="modalSubmit"){handleModalSubmit();return}
});

$("#dashSearch").addEventListener("input",()=>renderDashboard());
$("#containerFilter").addEventListener("input",renderContainers);
$("#itemFilter").addEventListener("input",renderItems);

function exportJson(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`home-warehouse-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast("备份已导出");
}
function restoreInput(){ $("#restoreInput").click() }
$("#backupBtn").onclick=exportJson;$("#backupBtn2").onclick=exportJson;
$("#restoreBtn").onclick=restoreInput;$("#restoreBtn2").onclick=restoreInput;
$("#restoreInput").addEventListener("change",e=>{
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const x=JSON.parse(r.result);
      if(x.version!==1||!Array.isArray(x.locations)||!Array.isArray(x.containers)||!Array.isArray(x.items)||!Array.isArray(x.containerItems))throw Error();
      if(!confirm("恢复备份会覆盖当前浏览器数据，确定继续吗？"))return;
      db=x;save();renderAll();toast("备份已恢复");
    }catch(err){alert("无效的 V1 JSON 备份")}
  };
  r.readAsText(file);e.target.value="";
});
$("#resetBtn").onclick=()=>{
  if(!confirm("确定恢复示例数据吗？当前数据会被覆盖。"))return;
  db=seed();save();renderAll();toast("已恢复示例数据");
};

renderAll();
})();
</script>
</body>
</html>
